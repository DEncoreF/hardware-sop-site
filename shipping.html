 '<div class="toolbar" id="tb" hidden><button class="btn" id="bEdit" type="button">編輯文字</button><button class="btn primary" id="bSave" type="button" hidden>儲存</button><button class="btn" id="bCancel" type="button" hidden>放棄修改</button><span class="status" id="st"></span><span class="hint" id="hint" hidden>點流程圖裡的文字可修改，清空文字的方框會被移除；標題、圖例、圖說可直接點進去打字。</span></div>'+
 '<header><div class="eyebrow" data-h="eyebrow">'+esc(S.eyebrow)+'</div><h1 data-h="title">'+esc(S.title)+'</h1><p class="lede" data-h="lede">'+esc(S.lede)+'</p>'+
 '<div class="legend">'+li('--r-sales','sales')+li('--r-hw','hw')+li('--r-fin','fin')+li('--r-int','int')+li('--r-wh','wh')+li('--accent-tint','note',';border:1px dashed var(--accent)')+'</div></header>'+
 [CUR].map(function(f){return '<section class="flow"><h2 data-h="'+f+'.h">'+esc(S[f].h)+'</h2><figure><div class="frame" data-flow="'+f+'">'+svg(f)+'</div>'+(S[f].caption&&S[f].caption.trim()?'<figcaption data-h="'+f+'.caption">'+esc(S[f].caption)+'</figcaption>':'')+'</figure></section>';}).join('')+
 '</div>';
}
var root=document.getElementById('app');
function setPath(path,val){var p=path.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
function render(){root.innerHTML=page();bind();applyMode();}
function status(t){var e=document.getElementById('st');if(e)e.textContent=t||'';}
function applyMode(){
 document.body.classList.toggle('editing',EDIT);
 var tb=document.getElementById('tb');tb.hidden=!art||readOnly;
 document.getElementById('bEdit').hidden=EDIT;document.getElementById('bSave').hidden=!EDIT;document.getElementById('bCancel').hidden=!EDIT;document.getElementById('hint').hidden=!EDIT;
 document.getElementById('bSave').disabled=!dirty;
 root.querySelectorAll('[data-h]').forEach(function(el){if(EDIT){el.setAttribute('contenteditable','true');el.setAttribute('spellcheck','false');}else el.removeAttribute('contenteditable');});
 if(EDIT&&dirty)status('有未儲存的修改');
}
function bind(){
 document.getElementById('bEdit').onclick=function(){EDIT=true;applyMode();status('');};
 document.getElementById('bCancel').onclick=function(){S=JSON.parse(document.getElementById('state').textContent);EDIT=false;dirty=false;closeEd();render();status('');};
 document.getElementById('bSave').onclick=save;
 root.querySelectorAll('[data-tab]').forEach(function(b){b.onclick=function(){CUR=b.getAttribute('data-tab');try{localStorage.setItem('aiso-flow-tab',CUR);}catch(e){}closeEd();render();};});
 root.querySelectorAll('[data-h]').forEach(function(el){
  el.addEventListener('input',function(){if(!EDIT)return;setPath(el.getAttribute('data-h'),el.innerText.replace(/\n+/g,' ').trim());dirty=true;document.getElementById('bSave').disabled=false;status('有未儲存的修改');});
  el.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();el.blur();}});
  el.addEventListener('paste',function(e){if(!EDIT)return;e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,t.replace(/\s*\n\s*/g,' '));});
 });
 root.querySelectorAll('.frame').forEach(function(fr){fr.addEventListener('click',function(e){
  if(!EDIT)return;var t=e.target.closest('[data-k]');if(!t)return;openEd(fr.getAttribute('data-flow'),t.getAttribute('data-k'),e.clientX,e.clientY);});});
}
var ed=null;
function closeEd(){if(ed){ed.remove();ed=null;}}
function openEd(f,k,x,y){
 closeEd();ed=document.createElement('div');ed.className='editor';
 ed.innerHTML='<label for="edTa">修改文字（換行即分行）</label><textarea id="edTa"></textarea><div class="row"><button class="btn" type="button" id="edC">取消</button><button class="btn primary" type="button" id="edOk">套用</button></div>';
 document.body.appendChild(ed);var ta=ed.querySelector('textarea');ta.value=S[f].t[k]||'';
 var w=ed.offsetWidth,h=ed.offsetHeight;ed.style.left=Math.max(16,Math.min(x-w/2,innerWidth-w-16))+'px';ed.style.top=Math.max(16,Math.min(y+14,innerHeight-h-16))+'px';
 ta.focus();ta.select();
 ed.querySelector('#edC').onclick=closeEd;
 ed.querySelector('#edOk').onclick=function(){var v=ta.value.replace(/\r/g,'').replace(/\n{2,}/g,'\n').replace(/^\n+|\n+$/g,'');S[f].t[k]=v||' ';dirty=true;closeEd();root.querySelector('.frame[data-flow="'+f+'"]').innerHTML=svg(f);document.getElementById('bSave').disabled=false;status('有未儲存的修改');};
 ta.addEventListener('keydown',function(e){if(e.key==='Escape')closeEd();if(e.key==='Enter'&&(e.metaKey||e.ctrlKey))ed.querySelector('#edOk').click();});
}
function docHtml(){
 var style=document.getElementById('page-style').outerHTML;
 var script=document.getElementById('app-script').textContent;
 var json=JSON.stringify(S).replace(/</g,'\\u003c');
 var font='<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>'+
  '<title>'+esc(S.title)+'</title>\n'+font+'\n'+style+'\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app-script">'+script+'<\/script>\n</body></html>';
}
function save(){
 if(!art||!dirty)return;var b=document.getElementById('bSave');b.disabled=true;status('儲存中…');
 art.publish(docHtml()).then(function(){status('已儲存');dirty=false;}).catch(function(err){
  var c=err&&err.code;
  if(c==='conflict'){status('有人剛儲存了新版本，頁面會重新載入到最新內容。');}
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){readOnly=true;EDIT=false;status('這個檢視沒有編輯權限，修改無法儲存。');applyMode();document.getElementById('tb').hidden=false;document.getElementById('bEdit').hidden=true;}
  else if(c==='rate_limited'){status('儲存太頻繁，請稍候再按一次。');b.disabled=false;}
  else if(c==='too_large'){status('內容太大，無法儲存。');b.disabled=false;}
  else{status('儲存失敗，請稍後再試。');b.disabled=false;}
 });
}
render();
if(window.claude&&window.claude.use){window.claude.use('artifact').then(function(ns){art=ns;applyMode();}).catch(function(){});}
})();
</script>
</body>
</html>
